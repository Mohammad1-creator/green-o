name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash runs with pipefail, so "cmd | tee log" still fails when cmd fails.
defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: 1
  SUPABASE_CLI: npx -y supabase@3.1.0

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: mkdir -p ci-logs
      - run: npm ci 2>&1 | tee ci-logs/npm-ci.log
      - run: npm run lint 2>&1 | tee ci-logs/lint.log
      - run: npm run typecheck 2>&1 | tee ci-logs/typecheck.log
      - run: npm run format:check 2>&1 | tee ci-logs/format.log
      - run: npm test 2>&1 | tee ci-logs/unit.log
      - run: npm run build 2>&1 | tee ci-logs/build.log
      - name: Check build output for secrets
        run: npm run check:secrets 2>&1 | tee ci-logs/secrets.log
      - name: Annotate failures
        if: failure()
        run: bash scripts/ci/annotate-failures.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-checks
          path: ci-logs/
          retention-days: 7

  gitleaks:
    name: Secret scan of commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # lets gitleaks comment on a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      # The job summary needs a signed-in account, so on a finding the redacted
      # report (rule, file, line, fingerprint; never the value) is published too.
      - name: Report findings (redacted)
        if: failure()
        run: |
          mkdir -p ci-logs
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path ci-logs/gitleaks.json || true
          node -e "const r=require('./ci-logs/gitleaks.json'); for (const f of r) console.log([f.RuleID, f.File + ':' + f.StartLine, f.Commit.slice(0, 7), f.Fingerprint].join(' | '))" | tee ci-logs/gitleaks.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-gitleaks
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: Database, integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: mkdir -p ci-logs
      - run: npm ci 2>&1 | tee ci-logs/npm-ci.log
      # Logs are published to a public branch, so keys printed by the CLI
      # (local demo keys, but still key-shaped) are masked first.
      - name: Start Supabase
        run: $SUPABASE_CLI start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/supabase-start.log
      - name: Record status variable names
        run: $SUPABASE_CLI status -o env 2>/dev/null | sed 's/=.*/=<hidden>/' | tee ci-logs/status-names.log
      - name: Database tests (pgTAP)
        run: $SUPABASE_CLI test db 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/db-test.log
      - name: Database lint
        run: $SUPABASE_CLI db lint --schema public,private,audit --level warning --fail-on error 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/db-lint.log
      - name: Generate TypeScript types
        run: |
          $SUPABASE_CLI gen types --lang typescript --schema public > ci-logs/database.ts
          if ! diff -q ci-logs/database.ts src/types/database.ts > /dev/null 2>&1; then
            echo "::warning::src/types/database.ts is out of date. Copy it from the ci-results branch."
          fi
      - name: Point the app at the local Supabase
        run: $SUPABASE_CLI status -o env 2>/dev/null | node scripts/ci/export-supabase-env.mjs
      - name: Seed demo data
        env:
          APP_ENV: local
        run: npm run seed:dev 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/seed.log
      - name: Integration tests (API)
        run: npm run test:integration 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/integration.log
      - name: Build against the local Supabase
        env:
          APP_ENV: local
        run: npm run build 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/app-build.log
      - name: Check that the secret key stayed out of the build
        run: npm run check:secrets 2>&1 | tee ci-logs/app-secrets.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium > ci-logs/playwright-install.log 2>&1
      - name: End-to-end tests
        env:
          APP_ENV: local
        run: npm run test:e2e 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/e2e.log
      - name: Backup round trip (dump, encrypt, decrypt, verify)
        run: bash scripts/ci/backup-round-trip.sh 2>&1 | node scripts/ci/redact.mjs | tee ci-logs/backup.log
      - name: Keep page snapshots of failed tests
        if: failure()
        run: |
          mkdir -p ci-logs/e2e-failures
          find test-results -name 'error-context.md' 2>/dev/null | while read -r file; do
            name=$(echo "$file" | sed 's|^test-results/||; s|/error-context.md$||; s|[^A-Za-z0-9._-]|_|g')
            node scripts/ci/redact.mjs < "$file" > "ci-logs/e2e-failures/${name}.md"
          done
      - name: Annotate failures
        if: failure()
        run: bash scripts/ci/annotate-failures.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-database
          path: ci-logs/
          retention-days: 7

  # Publishes every job's logs to the ci-results branch, so they can be read
  # with git (job logs need a signed-in account; git does not).
  report:
    name: Publish results
    if: always() && github.event_name != 'pull_request'
    needs: [checks, gitleaks, database]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: logs-*
          path: logs
      - name: Push logs to ci-results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_DIR: runs/${{ github.run_number }}-${{ github.sha }}
          SUMMARY: |
            sha=${{ github.sha }}
            run=${{ github.run_number }}
            checks=${{ needs.checks.result }}
            gitleaks=${{ needs.gitleaks.result }}
            database=${{ needs.database.result }}
        run: |
          git init -q results && cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin ci-results 2>/dev/null; then
            git checkout -q -b ci-results FETCH_HEAD
          else
            git checkout -q --orphan ci-results
          fi
          mkdir -p "$RUN_DIR"
          if [ -d ../logs ]; then cp -r ../logs/. "$RUN_DIR/"; fi
          printf '%s' "$SUMMARY" > "$RUN_DIR/summary.txt"
          cp "$RUN_DIR/summary.txt" latest.txt
          # Keep the 30 most recent runs.
          ls -1 runs | sort -t- -k1,1n | head -n -30 | sed 's|^|runs/|' | xargs -r git rm -rq --ignore-unmatch
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          for attempt in 1 2 3 4 5; do
            if out=$(git push -q origin HEAD:ci-results 2>&1); then exit 0; fi
            out=$(printf '%s' "$out" | sed 's/x-access-token:[^@]*@//g' | tr '\n' ' ' | cut -c1-1500)
            echo "::warning title=Push attempt ${attempt} failed::${out}"
            git pull -q --rebase origin ci-results 2>/dev/null || true
          done
          exit 1
